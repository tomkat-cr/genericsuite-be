[project]
name = "genericsuite"
version = "0.4.0"
authors = [
    { name="Carlos J. Ramirez", email="info@genericsuite.com" }
]
description = "The GenericSuite for Python (backend version)"
readme = "README.md"
requires-python = ">=3.10,<4.0"
classifiers = [
    'Development Status :: 3 - Alpha',
    'Environment :: Console',
    'Intended Audience :: Developers',
    "Programming Language :: Python :: 3",
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    "Operating System :: OS Independent",
    'Topic :: Software Development',
]
dynamic = [
    "license",
]

[project.urls]
Homepage = "https://genericsuite.carlosjramirez.com/Backend-Development/GenericSuite-Core/"
Issues = "https://github.com/tomkat-cr/genericsuite-be/issues"

[tool.poetry]
name = "genericsuite"
version = "0.4.0"
description = "The GenericSuite for Python (backend version)"
authors = ["Carlos J. Ramirez <info@genericsuite.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/tomkat-cr/genericsuite-be.git"
homepage = "https://genericsuite.carlosjramirez.com/Backend-Development/GenericSuite-Core/"
packages = [
    { include = "genericsuite" }
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pyjwt = "^2.13.0"
werkzeug = "^3.1.6"
cryptography = "^50.0.0"
pydantic = "^2.9.2"
urllib3 = "^2.7.0"
requests-toolbelt = "^1.0.0"
slowapi = "^0.1.10"

[tool.poetry.extras]
gcp = ["google-cloud-storage", "google-cloud-secret-manager"]
azure = ["azure-storage-blob", "azure-identity", "azure-keyvault-secrets"]

[tool.poetry.dependencies.google-cloud-storage]
version = ">=2.0.0"
optional = true

[tool.poetry.dependencies.google-cloud-secret-manager]
version = ">=2.0.0"
optional = true

[tool.poetry.dependencies.azure-storage-blob]
version = ">=12.0.0"
optional = true

[tool.poetry.dependencies.azure-identity]
version = ">=1.0.0"
optional = true

[tool.poetry.dependencies.azure-keyvault-secrets]
version = ">=4.0.0"
optional = true

[tool.poetry.group.dev.dependencies]
changelog-cli = "^0.7.1"
mypy = "^0.931"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
yapf = "^0.32.0"
coverage = "^7.2.7"
pylint = "^3.1.0"
flake8 = "^7.0.0"
build = "^1.3.0"
twine = "^7.0.0"
pymongo = "^4.15.5"
boto3 = "^1.42.10"
fastapi = "^0.140.13"
mangum = "^0.21.0"
pytest-mock = "^3.15.1"
fastmcp = "^3.4.5"
pysonar = "^1.7.0.5143"
starlette = "^1.3.1"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
